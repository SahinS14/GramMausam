<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GramMausam System Architecture</title><desc id="desc">Architecture from user browser through React frontend, FastAPI backend, Ridge Residual ML model and Dhanbad Panchayat dataset to rainfall forecasts and farm advisory.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b3a"/><stop offset="1" stop-color="#0d3765"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#123f70"/><stop offset="1" stop-color="#0b2c53"/></linearGradient>
    <linearGradient id="output" x2="1" y2="1"><stop stop-color="#0d5c58"/><stop offset="1" stop-color="#0b3d53"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d6ff"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.label{font-size:15px;fill:#b9d0e9}.title{font-size:23px;font-weight:800;fill:#fff}.small{font-size:14px;fill:#d9e9f8}.tag{font-size:13px;font-weight:700;fill:#a7f3d0}.kicker{font-size:14px;font-weight:800;letter-spacing:3px;fill:#72e3b7}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="100" r="260" fill="#1f6ca5" opacity=".18"/><circle cx="120" cy="820" r="260" fill="#139b7d" opacity=".15"/>
  <text x="80" y="85" font-size="46" font-weight="800" fill="#fff">GramMausam</text><text x="80" y="117" class="label">Panchayat-level weather downscaling for Dhanbad District, Jharkhand</text>
  <rect x="80" y="150" width="1440" height="48" rx="16" fill="#ffffff" opacity=".08"/><text x="110" y="180" class="kicker">SYSTEM ARCHITECTURE  •  BLOCK FORECAST → LOCAL ML ADJUSTMENT → PANCHAYAT ACTION</text>
  <g filter="url(#shadow)"><rect x="650" y="230" width="300" height="88" rx="20" fill="#164a7b" stroke="#62d6ff" stroke-width="1.5"/><text x="800" y="267" text-anchor="middle" class="title">Public Weather Forecast</text><text x="800" y="294" text-anchor="middle" class="small">Open-Meteo · no-auth public source</text></g>
  <path d="M800 318V365" stroke="#62d6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="70" y="390" width="255" height="250" rx="22" fill="url(#card)" stroke="#3b8ac4"/><text x="100" y="432" class="title">1. User / Farmer</text><text x="100" y="460" class="title">Browser</text><text x="100" y="505" class="small">• Selects Panchayat</text><text x="100" y="536" class="small">• Views local forecast</text><text x="100" y="567" class="small">• Reads farm guidance</text><rect x="100" y="592" width="160" height="25" rx="12" fill="#1b7ba5"/><text x="180" y="610" text-anchor="middle" class="tag">Current location option</text></g>
  <g filter="url(#shadow)"><rect x="400" y="390" width="255" height="250" rx="22" fill="url(#card)" stroke="#3b8ac4"/><text x="430" y="432" class="title">2. React Frontend</text><text x="430" y="460" class="title">Vite + TypeScript</text><text x="430" y="505" class="small">• Dashboard &amp; map</text><text x="430" y="536" class="small">• Forecast &amp; advice pages</text><text x="430" y="567" class="small">• Saved location selection</text><rect x="430" y="592" width="156" height="25" rx="12" fill="#1b7ba5"/><text x="508" y="610" text-anchor="middle" class="tag">Interactive UI</text></g>
  <g filter="url(#shadow)"><rect x="730" y="365" width="255" height="300" rx="22" fill="url(#card)" stroke="#62d6ff" stroke-width="2"/><text x="760" y="407" class="title">3. FastAPI Backend</text><text x="760" y="447" class="small">• API orchestration</text><text x="760" y="478" class="small">• Feature engineering</text><text x="760" y="509" class="small">• Prediction service</text><text x="760" y="540" class="small">• Advisory rules</text><rect x="760" y="580" width="160" height="30" rx="15" fill="#0f9b7c"/><text x="840" y="601" text-anchor="middle" class="tag">localhost:8000</text></g>
  <g filter="url(#shadow)"><rect x="1060" y="390" width="220" height="250" rx="22" fill="url(#card)" stroke="#3b8ac4"/><text x="1090" y="432" class="title">4. Ridge Residual</text><text x="1090" y="460" class="title">ML Model</text><text x="1090" y="505" class="small">• Learns local residual</text><text x="1090" y="536" class="small">• Downscales rainfall</text><text x="1090" y="567" class="small">• Panchayat estimate</text><rect x="1090" y="592" width="138" height="25" rx="12" fill="#1b7ba5"/><text x="1159" y="610" text-anchor="middle" class="tag">joblib model</text></g>
  <g filter="url(#shadow)"><rect x="1330" y="390" width="200" height="250" rx="22" fill="url(#card)" stroke="#3b8ac4"/><text x="1360" y="432" class="title">5. Dhanbad Data</text><text x="1360" y="475" class="small">• 239 Panchayats</text><text x="1360" y="506" class="small">• 10 blocks</text><text x="1360" y="537" class="small">• Historical rainfall</text><text x="1360" y="568" class="small">• Terrain features</text><rect x="1360" y="592" width="124" height="25" rx="12" fill="#1b7ba5"/><text x="1422" y="610" text-anchor="middle" class="tag">CSV dataset</text></g>
  <path d="M325 515H390" stroke="#62d6ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 515H720" stroke="#62d6ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 515H1050" stroke="#62d6ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1330 545H1290" stroke="#62d6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1015" y="490" class="label">ML inference</text><text x="680" y="490" class="label">REST API</text>
  <path d="M1165 655V716" stroke="#72e3b7" stroke-width="3"/><path d="M1165 716H770V755" stroke="#72e3b7" stroke-width="3" marker-end="url(#arrow)"/><path d="M1165 716H1190V755" stroke="#72e3b7" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="555" y="760" width="430" height="96" rx="22" fill="url(#output)" stroke="#72e3b7"/><text x="585" y="800" class="title">Panchayat Rainfall Forecast</text><text x="585" y="829" class="small">Block rainfall + local model adjustment = Panchayat estimate</text></g>
  <g filter="url(#shadow)"><rect x="1055" y="760" width="390" height="96" rx="22" fill="url(#output)" stroke="#72e3b7"/><text x="1085" y="800" class="title">Farm Advisory</text><text x="1085" y="829" class="small">Rainfall, wind and season-aware action guidance</text></g>
  <text x="80" y="850" class="label">Model coverage: Dhanbad District only · Prototype decision-support system · Not an official weather warning</text>
</svg>
