<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">GramMausam production system architecture</title>
  <desc id="desc">A two-lane architecture showing offline data and Ridge Residual model training, and the live user forecast and farm advisory inference flow.</desc>
  <defs>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071d3c"/><stop offset="1" stop-color="#0a3961"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#007b6d"/><stop offset="1" stop-color="#009d83"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1267b5"/><stop offset="1" stop-color="#238dd4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0b2744" flood-opacity=".14"/></filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#008b78"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#1c78c5"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif}.eyebrow{font-size:15px;font-weight:800;letter-spacing:2.2px;fill:#3a83b8}.h1{font-size:48px;font-weight:800;fill:#0a2545}.subtitle{font-size:21px;fill:#52697d}.lane-title{font-size:18px;font-weight:800;letter-spacing:1.4px;fill:#fff}.card-title{font-size:21px;font-weight:800;fill:#092743}.card-copy{font-size:16px;fill:#4e657a}.small{font-size:14px;fill:#5e7487}.pill{font-size:13px;font-weight:800;fill:#0d695f}.label{font-size:14px;font-weight:800;fill:#2376b5}.out-title{font-size:20px;font-weight:800;fill:#fff}.out-copy{font-size:15px;fill:#e4f7f4}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f6f9fc"/>
  <path d="M0 0H1920V160H0Z" fill="url(#navy)"/>
  <circle cx="1700" cy="-40" r="250" fill="#1f7f9a" opacity=".22"/><circle cx="160" cy="35" r="180" fill="#168b75" opacity=".18"/>
  <text x="90" y="61" font-size="29" font-weight="800" fill="#fff">GramMausam</text><text x="90" y="91" font-size="15" font-weight="700" letter-spacing="2" fill="#99d5d4">PANCHAYAT WEATHER INTELLIGENCE</text>
  <text x="90" y="219" class="eyebrow">SYSTEM DESIGN · SIH 2026</text><text x="90" y="271" class="h1">From block weather to Panchayat action</text><text x="90" y="307" class="subtitle">A deployable ML decision-support platform for Dhanbad District, Jharkhand</text>

  <!-- lane labels -->
  <rect x="90" y="350" width="1740" height="46" rx="14" fill="url(#teal)"/><text x="120" y="380" class="lane-title">OFFLINE DATA &amp; MODEL DEVELOPMENT  ·  Governed historical learning pipeline</text>
  <rect x="90" y="648" width="1740" height="46" rx="14" fill="url(#blue)"/><text x="120" y="678" class="lane-title">LIVE FORECAST DELIVERY  ·  Real-time inference and farmer-facing decision support</text>

  <!-- training cards -->
  <g filter="url(#shadow)"><rect x="90" y="423" width="310" height="177" rx="18" fill="#fff"/><rect x="90" y="423" width="7" height="177" rx="3" fill="#00a486"/><text x="120" y="462" class="card-title">Historical weather data</text><text x="120" y="495" class="card-copy">CHIRPS rainfall labels</text><text x="120" y="522" class="card-copy">ERA5-Land reference rainfall</text><rect x="120" y="548" width="124" height="28" rx="14" fill="#e7f8f3"/><text x="136" y="568" class="pill">TRAINING INPUT</text></g>
  <g filter="url(#shadow)"><rect x="470" y="423" width="310" height="177" rx="18" fill="#fff"/><rect x="470" y="423" width="7" height="177" rx="3" fill="#00a486"/><text x="500" y="462" class="card-title">Local feature catalogue</text><text x="500" y="495" class="card-copy">Panchayat boundary &amp; LGD metadata</text><text x="500" y="522" class="card-copy">Elevation · slope · land cover</text><rect x="500" y="548" width="150" height="28" rx="14" fill="#e7f8f3"/><text x="516" y="568" class="pill">SPATIAL CONTEXT</text></g>
  <g filter="url(#shadow)"><rect x="850" y="423" width="310" height="177" rx="18" fill="#fff"/><rect x="850" y="423" width="7" height="177" rx="3" fill="#00a486"/><text x="880" y="462" class="card-title">Feature engineering</text><text x="880" y="495" class="card-copy">Seasonality + weather variables</text><text x="880" y="522" class="card-copy">Residual = CHIRPS − ERA5-Land</text><rect x="880" y="548" width="170" height="28" rx="14" fill="#e7f8f3"/><text x="896" y="568" class="pill">REPRODUCIBLE PIPELINE</text></g>
  <g filter="url(#shadow)"><rect x="1230" y="423" width="260" height="177" rx="18" fill="#fff" stroke="#10a886" stroke-width="2"/><text x="1260" y="462" class="card-title">Model selection</text><text x="1260" y="495" class="card-copy">StandardScaler +</text><text x="1260" y="521" class="card-copy">Ridge α = 10.0</text><rect x="1260" y="548" width="156" height="28" rx="14" fill="#dff7ee"/><text x="1276" y="568" class="pill">RIDGE RESIDUAL</text></g>
  <g filter="url(#shadow)"><rect x="1560" y="423" width="270" height="177" rx="18" fill="#eef9f6" stroke="#10a886" stroke-width="2"/><text x="1590" y="462" class="card-title">Validated artifact</text><text x="1590" y="495" class="card-copy">Ridge_residual.joblib</text><text x="1590" y="522" class="card-copy">237 modelled Panchayats</text><rect x="1590" y="548" width="174" height="28" rx="14" fill="#c9f0e2"/><text x="1606" y="568" class="pill">DEPLOYED MODEL</text></g>
  <path d="M402 511H458" stroke="#008b78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M782 511H838" stroke="#008b78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1162 511H1218" stroke="#008b78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1492 511H1548" stroke="#008b78" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- runtime cards -->
  <g filter="url(#shadow)"><rect x="90" y="721" width="280" height="205" rx="18" fill="#fff"/><text x="120" y="761" class="card-title">Citizen / Farmer</text><text x="120" y="795" class="card-copy">Selects State → District →</text><text x="120" y="821" class="card-copy">Block → Panchayat</text><text x="120" y="862" class="small">Location persisted across pages</text></g>
<g filter="url(#shadow)"><rect x="435" y="721" width="290" height="205" rx="18" fill="#fff"/><text x="465" y="761" class="card-title">Web application</text><text x="465" y="795" class="card-copy">React 19 · TypeScript · Vite</text><text x="465" y="821" class="card-copy">TanStack Router/Query · MapLibre</text><rect x="465" y="855" width="145" height="28" rx="14" fill="#e8f3fc"/><text x="481" y="875" class="label">VERCEL DEPLOYMENT</text></g>
  <g filter="url(#shadow)"><rect x="790" y="721" width="310" height="205" rx="18" fill="#fff" stroke="#2586cf" stroke-width="2"/><text x="820" y="761" class="card-title">Inference API</text><text x="820" y="795" class="card-copy">FastAPI · Uvicorn · Pandas</text><text x="820" y="821" class="card-copy">Feature assembly + validation</text><rect x="820" y="855" width="145" height="28" rx="14" fill="#e8f3fc"/><text x="836" y="875" class="label">REST / JSON API</text></g>
  <g filter="url(#shadow)"><rect x="1165" y="721" width="290" height="205" rx="18" fill="#fff"/><text x="1195" y="761" class="card-title">Forecast + ML engine</text><text x="1195" y="795" class="card-copy">Open-Meteo public forecast</text><text x="1195" y="821" class="card-copy">scikit-learn + joblib inference</text><rect x="1195" y="855" width="176" height="28" rx="14" fill="#e8f3fc"/><text x="1211" y="875" class="label">LOCAL ADJUSTMENT</text></g>
  <g filter="url(#shadow)"><rect x="1520" y="721" width="310" height="205" rx="18" fill="url(#navy)"/><text x="1550" y="761" class="out-title">Decision-ready output</text><text x="1550" y="795" class="out-copy">5-day Panchayat rainfall</text><text x="1550" y="821" class="out-copy">ML adjustment explained</text><text x="1550" y="847" class="out-copy">Rule-based farm advice</text><rect x="1550" y="867" width="169" height="28" rx="14" fill="#1a8e79"/><text x="1567" y="887" font-size="13" font-weight="800" fill="#fff">FARMER-FACING UI</text></g>
  <path d="M372 823H423" stroke="#1c78c5" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M727 823H778" stroke="#1c78c5" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1102 823H1153" stroke="#1c78c5" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1457 823H1508" stroke="#1c78c5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1695 602V708" stroke="#008b78" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-teal)"/><text x="1713" y="664" class="small">Model loaded at startup</text>
  <rect x="90" y="977" width="1740" height="1" fill="#d3e0ea"/><text x="90" y="1020" font-size="15" fill="#52697d">Operational scope: Dhanbad District, Jharkhand · Model: Standardized Ridge Residual Regression · Evaluation: RMSE reduction of 34.8% vs. historical coarse ERA5 baseline</text>
  <text x="1830" y="1020" text-anchor="end" font-size="15" font-weight="800" fill="#0d695f">TEAM_AAGAZ · SILICON UNIVERSITY</text>
</svg>
