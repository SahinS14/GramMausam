<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">GramMausam system design</title>
  <desc id="desc">A corporate system design diagram showing users, browser, public weather and map providers, Render hosted dashboard and ML API, packaged model/data, offline training pipeline, and Panchayat forecast outputs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102b45" flood-opacity=".16"/></filter>
    <marker id="dark-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#31485a"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#007fc4"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#00856d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.t{fill:#1a2834}.h{font-size:21px;font-weight:700;fill:#1a2834}.s{font-size:16px;fill:#495a66}.xs{font-size:13px;fill:#526572}.zone{font-size:18px;font-weight:700;fill:#087db8}.cap{font-size:14px;font-weight:700;letter-spacing:1.3px;fill:#fff}.node{font-size:19px;font-weight:700;fill:#1b2934}.product{font-size:15px;fill:#53636e}.arrow{font-size:13px;font-weight:700;fill:#5b6770}.white{font-size:17px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1920" height="1200" fill="#fff"/>
  <rect x="0" y="0" width="1920" height="105" fill="#082a4a"/>
  <text x="72" y="48" font-size="29" font-weight="700" fill="#fff">GramMausam</text>
  <text x="72" y="76" font-size="15" letter-spacing="2" fill="#a8d9ef">PANCHAYAT WEATHER INTELLIGENCE PLATFORM</text>
  <text x="1848" y="52" text-anchor="end" font-size="19" font-weight="700" fill="#fff">System Design Architecture</text>
  <text x="1848" y="77" text-anchor="end" font-size="14" fill="#b8d9ea">Dhanbad District · TEAM_AAGAZ · Silicon University</text>

  <!-- external users -->
  <rect x="58" y="154" width="265" height="376" rx="4" fill="#fff" stroke="#253d50" stroke-width="2"/>
  <rect x="58" y="154" width="265" height="42" fill="#253d50"/><text x="78" y="181" class="cap">ACTORS / CLIENT DEVICES</text>
  <g filter="url(#shadow)"><rect x="88" y="224" width="204" height="112" rx="5" fill="#eef8ff" stroke="#2e91c8"/><circle cx="128" cy="267" r="20" fill="#2e91c8"/><path d="M102 302c6-28 46-28 52 0" fill="#2e91c8"/><text x="166" y="263" class="node">Farmer / Judge</text><text x="166" y="288" class="product">Uses browser</text></g>
  <g filter="url(#shadow)"><rect x="88" y="370" width="204" height="112" rx="5" fill="#eef8ff" stroke="#2e91c8"/><rect x="110" y="393" width="44" height="31" rx="3" fill="#2e91c8"/><path d="M121 430h22m-11-6v13" stroke="#2e91c8" stroke-width="4"/><text x="171" y="410" class="node">Web Browser</text><text x="171" y="435" class="product">HTTPS + Geolocation</text></g>

  <!-- external providers -->
  <rect x="58" y="600" width="265" height="460" rx="4" fill="#fff" stroke="#253d50" stroke-width="2"/>
  <rect x="58" y="600" width="265" height="42" fill="#253d50"/><text x="78" y="627" class="cap">EXTERNAL PUBLIC SERVICES</text>
  <g filter="url(#shadow)"><rect x="88" y="676" width="204" height="104" rx="5" fill="#edf9f6" stroke="#00856d"/><circle cx="124" cy="716" r="18" fill="#00856d"/><path d="M113 716h22M124 705v22" stroke="#fff" stroke-width="2"/><text x="155" y="711" class="node">Open-Meteo</text><text x="155" y="736" class="product">Forecast context API</text></g>
  <g filter="url(#shadow)"><rect x="88" y="814" width="204" height="104" rx="5" fill="#edf9f6" stroke="#00856d"/><path d="M108 848h35v35h-35z" fill="#00856d"/><path d="M114 870l8-10 8 6 7-11" fill="none" stroke="#fff" stroke-width="2"/><text x="155" y="850" class="node">OpenFreeMap</text><text x="155" y="875" class="product">Browser map tiles</text></g>
  <g filter="url(#shadow)"><rect x="88" y="952" width="204" height="78" rx="5" fill="#f5f7fa" stroke="#8395a5"/><text x="110" y="984" class="node">Browser location</text><text x="110" y="1008" class="product">Permission-based only</text></g>

  <!-- render boundary -->
  <rect x="390" y="154" width="1465" height="906" rx="4" fill="#f8fcff" stroke="#10a6e5" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="410" y="135" width="165" height="38" rx="4" fill="#10a6e5"/><text x="430" y="160" class="cap">RENDER CLOUD</text>
  <text x="598" y="161" class="h">Production deployment boundary</text>

  <!-- interface layer -->
  <rect x="426" y="210" width="650" height="355" rx="4" fill="#fff" stroke="#c9d9e5"/>
  <rect x="426" y="210" width="650" height="38" fill="#e2f3fc"/><text x="448" y="235" class="zone">PRESENTATION LAYER · PUBLIC WEB SERVICE</text>
  <g filter="url(#shadow)"><rect x="458" y="280" width="275" height="215" rx="6" fill="#fff" stroke="#2389c5" stroke-width="2"/><rect x="458" y="280" width="275" height="43" fill="#197dbb"/><text x="480" y="308" class="white">GramMausam Dashboard</text><text x="482" y="352" class="node">React 19 + TypeScript</text><text x="482" y="379" class="product">Vite · TanStack Start</text><text x="482" y="406" class="product">Router · Query · Tailwind</text><text x="482" y="433" class="product">MapLibre map experience</text><text x="482" y="469" class="xs">Hosted: grammausam-dashboard.onrender.com</text></g>
  <g filter="url(#shadow)"><rect x="772" y="280" width="272" height="215" rx="6" fill="#f5fbff" stroke="#2389c5"/><text x="796" y="323" class="node">User experience modules</text><text x="796" y="358" class="product">• Location selection</text><text x="796" y="384" class="product">• Live weather summary</text><text x="796" y="410" class="product">• 5-day forecast</text><text x="796" y="436" class="product">• Farm advice + blogs</text><text x="796" y="469" class="xs">Selected Panchayat stored in browser</text></g>
  <path d="M735 388H760" stroke="#007fc4" stroke-width="3" marker-end="url(#blue-arrow)"/>

  <!-- service layer -->
  <rect x="1120" y="210" width="702" height="355" rx="4" fill="#fff" stroke="#c9d9e5"/>
  <rect x="1120" y="210" width="702" height="38" fill="#e2f3fc"/><text x="1142" y="235" class="zone">APPLICATION &amp; INFERENCE LAYER · PUBLIC API WEB SERVICE</text>
  <g filter="url(#shadow)"><rect x="1152" y="280" width="275" height="215" rx="6" fill="#fff" stroke="#00766d" stroke-width="2"/><rect x="1152" y="280" width="275" height="43" fill="#00766d"/><text x="1174" y="308" class="white">FastAPI Prediction Service</text><text x="1176" y="352" class="node">Python · Uvicorn</text><text x="1176" y="379" class="product">Input validation + CORS</text><text x="1176" y="406" class="product">Forecast orchestration</text><text x="1176" y="433" class="product">JSON REST endpoints</text><text x="1176" y="469" class="xs">/health · /panchayats · /forecast</text></g>
  <g filter="url(#shadow)"><rect x="1462" y="280" width="328" height="215" rx="6" fill="#f1fbf7" stroke="#00856d"/><text x="1486" y="323" class="node">Inference workflow</text><text x="1486" y="358" class="product">1. Resolve selected Panchayat</text><text x="1486" y="384" class="product">2. Assemble local features</text><text x="1486" y="410" class="product">3. Apply Ridge Residual</text><text x="1486" y="436" class="product">4. Generate safe farm rules</text><text x="1486" y="469" class="xs">Stateless request processing</text></g>
  <path d="M1429 388H1450" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/>

  <!-- model data layer -->
  <rect x="426" y="625" width="1396" height="315" rx="4" fill="#fff" stroke="#c9d9e5"/>
  <rect x="426" y="625" width="1396" height="38" fill="#e8f7f3"/><text x="448" y="650" class="zone" fill="#00856d">DATA &amp; MODEL LAYER · VERSIONED PROJECT ARTIFACTS LOADED BY FASTAPI</text>
  <g filter="url(#shadow)"><rect x="460" y="699" width="285" height="178" rx="5" fill="#fafcfd" stroke="#8096a8"/><ellipse cx="502" cy="738" rx="20" ry="9" fill="#71879a"/><path d="M482 738v35c0 12 40 12 40 0v-35" fill="#71879a"/><text x="540" y="737" class="node">Panchayat catalogue</text><text x="540" y="763" class="product">239 metadata records</text><text x="490" y="812" class="product">LGD / boundaries · block</text><text x="490" y="837" class="product">names · terrain attributes</text></g>
  <g filter="url(#shadow)"><rect x="785" y="699" width="285" height="178" rx="5" fill="#fafcfd" stroke="#8096a8"/><ellipse cx="827" cy="738" rx="20" ry="9" fill="#71879a"/><path d="M807 738v35c0 12 40 12 40 0v-35" fill="#71879a"/><text x="865" y="737" class="node">Feature data store</text><text x="865" y="763" class="product">Master CSV / Pandas</text><text x="815" y="812" class="product">Rainfall · humidity · wind</text><text x="815" y="837" class="product">temperature · ET · terrain</text></g>
  <g filter="url(#shadow)"><rect x="1110" y="699" width="320" height="178" rx="5" fill="#edf9f6" stroke="#00856d" stroke-width="2"/><circle cx="1152" cy="746" r="25" fill="#00856d"/><path d="M1140 755l10-22 10 22z" fill="#fff"/><text x="1192" y="737" class="node">Ridge Residual artifact</text><text x="1192" y="763" class="product">scikit-learn + joblib</text><text x="1140" y="812" class="product">StandardScaler → Ridge (α = 10)</text><text x="1140" y="837" class="product">Panchayat residual prediction</text></g>
  <g filter="url(#shadow)"><rect x="1470" y="699" width="320" height="178" rx="5" fill="#f5f7fa" stroke="#8096a8"/><text x="1494" y="737" class="node">Rule-based advisory engine</text><text x="1494" y="763" class="product">Application business rules</text><text x="1494" y="812" class="product">Rain · wind · irrigation · spray</text><text x="1494" y="837" class="product">Planning guidance, not warnings</text></g>

  <!-- offline training -->
  <rect x="426" y="979" width="820" height="57" rx="4" fill="#f4f1fb" stroke="#a37bd7"/><text x="451" y="1004" font-size="17" font-weight="700" fill="#68419e">OFFLINE ML DEVELOPMENT (not on the live request path)</text><text x="451" y="1025" class="xs">CHIRPS + ERA5-Land + terrain → feature engineering → benchmark candidates → validate → package Ridge_residual.joblib</text>
  <path d="M1272 849V957H1010V947" fill="none" stroke="#8d68bf" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dark-arrow)"/><text x="1080" y="979" class="arrow">retrain / release model artifact</text>

  <!-- output area -->
  <rect x="1280" y="979" width="542" height="57" rx="4" fill="#073b58"/><text x="1305" y="1004" class="white">EXPLAINABLE DECISION OUTPUT</text><text x="1305" y="1025" font-size="14" fill="#c6e4f4">Block forecast → local ML adjustment → Panchayat rainfall + farm guidance</text>

  <!-- cross component flows -->
  <path d="M324 425H445" fill="none" stroke="#31485a" stroke-width="3" marker-end="url(#dark-arrow)"/><text x="350" y="408" class="arrow">HTTPS</text>
  <path d="M1076 388H1140" fill="none" stroke="#007fc4" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="1081" y="371" class="arrow">REST / JSON</text>
  <path d="M323 865H390V510H447" fill="none" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/><text x="339" y="847" class="arrow">map tiles</text>
  <path d="M323 728H360V599H1288V506" fill="none" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/><text x="730" y="585" class="arrow">HTTPS weather request</text>
  <path d="M1288 496V684" fill="none" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/><text x="1304" y="605" class="arrow">load features + model</text>
  <path d="M1099 788H1138" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M1432 788H1458" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M1750 876V956H1560V947" fill="none" stroke="#00856d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="57" y="1136" font-size="13" fill="#586b78">Solid arrows: runtime HTTPS/data flow · Dashed purple arrow: offline model release · The system currently targets Dhanbad District, Jharkhand only.</text>
</svg>
